<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS Concept Book v8 (v7 PDF Highlighting Based)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="v4 v8">
  <main class="concept-app">
    <aside class="concept-sidebar">
      <div class="concept-brand">
        <span class="concept-kicker">AWS SAP-C02 v8</span>
        <h1>Concept Book v8</h1>
        <p>v7 PDF 형광펜 분석 기반 AWS 서비스 출현 빈도 및 핵심 개념 정리</p>
      </div>

      <div class="concept-filter-group">
        <label class="concept-search-label" for="conceptSearch">서비스 찾기</label>
        <input id="conceptSearch" class="concept-search" type="search" placeholder="예: ALB, NLB, S3, Lambda" />

        <label class="concept-search-label" for="sortSelect">정렬 방식</label>
        <select id="sortSelect" class="concept-select">
          <option value="answer">정답 형광펜 빈도순</option>
          <option value="total">전체 형광펜 빈도순</option>
          <option value="name">서비스 이름순</option>
        </select>
      </div>

      <nav id="serviceList" class="service-list" aria-label="AWS 서비스 목록"></nav>
    </aside>

    <section class="concept-main">
      <header class="concept-header">
        <div>
          <span class="concept-kicker">AWS SERVICE HIGHLIGHT ANALYSIS</span>
          <h2 id="serviceTitle">서비스를 선택하세요</h2>
        </div>
        <span id="serviceCount" class="concept-count"></span>
      </header>
      <div id="serviceContent" class="concept-content">
        <div class="concept-empty">왼쪽에서 서비스를 선택하면 v7 형광펜 기반 핵심 개념과 문제 연결이 표시됩니다.</div>
      </div>
    </section>
  </main>

  <script src="concepts_v8.data.js"></script>
  <script src="app8.js"></script>
</body>
</html>
