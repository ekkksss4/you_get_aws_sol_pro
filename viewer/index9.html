<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS Question Viewer v9</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="v6">
  <main class="page">
    <header class="hero">
      <h1>AWS Question Viewer v9</h1>
      <p>중복 문제를 제외하고 텍스트에 실제로 칠해진 형광펜만 표시합니다.</p>
    </header>
    <section class="controls">
      <div class="nav">
        <button id="prevBtn" type="button">이전</button>
        <span id="progress">0 / 0</span>
        <button id="nextBtn" type="button">다음</button>
      </div>
      <div class="jump">
        <label for="jumpInput">Q번호 이동</label>
        <input id="jumpInput" type="number" min="1" />
        <button id="jumpBtn" type="button">이동</button>
      </div>
    </section>
    <section id="status" class="status">데이터를 불러오는 중입니다.</section>
    <article id="card" class="card hidden">
      <h2 id="qTitle"></h2>
      <p id="qText" class="question"></p>
      <ul id="choiceList" class="choices"></ul>
      <p id="answer" class="answer"></p>
    </article>
  </main>
  <script src="questions.data.js"></script>
  <script src="questions_v9.data.js"></script>
  <script src="pdf_highlights_v9.data.js"></script>
  <script src="app9.js"></script>
</body>
</html>
